<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{pages/home :: head(title='PNP: Products')}">
</head>

<body>
<div th:replace="~{pages/home :: header(currentPage='products')}"></div>
<main class="container">

    <h2>Products</h2>
    <form th:action="@{/products}">
        <label class="form-label" for="productkeyword">Filter: </label>
        <input type="text" name="productkeyword" id="productkeyword" size="50" th:value="${productkeyword}"
                       required/>

        <input class="btn btn-primary" type="submit" value="Search"/>

        <input  class="btn btn-primary" type="button" value="Clear" id="btnClearProduct" onclick="clearSearch()"/>
    </form>
    <br><br>
    <hr>

    <a th:href="@{/showFormAddProduct}" class="btn btn-primary btn-sm mb-3">Add Product</a>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempProduct : ${products}">
            <td th:text="${tempProduct.name}">1</td>
            <td th:text="${tempProduct.price}">1</td>
            <td th:text="${tempProduct.inv}">1</td>
            <td><a th:href="@{/showProductFormForUpdate(productID=${tempProduct.id})}"
                   class="btn btn-primary btn-sm mb-3">Update</a>
                <a th:href="@{/deleteproduct(productID=${tempProduct.id})}" class="btn btn-primary btn-sm mb-3"
                   onclick="if(!(confirm('Are you sure you want to delete this product?')))return false">Delete</a>

                <a th:if="${tempProduct.inv > 0}" th:href="@{/buyproduct(productID=${tempProduct.id})}" class="btn btn-primary btn-sm mb-3" >Buy Now</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script type="text/javascript">
    function clearSearch() {
        window.location = "[[@{/products}]]";
    }
</script>
</body>
</html>
