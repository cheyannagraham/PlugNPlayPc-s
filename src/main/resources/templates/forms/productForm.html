<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{pages/mainscreen :: head(title='PNP: Add Product')}">
</head>
<body>

<div th:replace="~{pages/mainscreen :: header(currentPage='products')}"></div>
<main class="container">
    <div class="my-3 py-3">
        <h2>Product Detail</h2>
        <form action="#" th:action="@{/showFormAddProduct}" th:object="${product}" method="POST" }>
            <!-- Add hidden form field to handle update -->
            <input type="hidden" th:field="*{id}"/>

            <label class="form-label" for="product-name">Product Name</label>
            <input id="product-name" type="text" th:field="*{name}" placeholder="Name" class="form-control mb-4 col-4"/>

            <label class="form-label" for="product-price">Price</label>
            <input id="product-price" type="text" th:field="*{price}" placeholder="Price"
                   class="form-control mb-4 col-4"/>

            <label class="form-label" for="product-inventory">Inventory</label>
            <input id="product-inventory" type="text" th:field="*{inv}" placeholder="Inventory"
                   class="form-control mb-4 col-4"/>


            <div th:if="${#fields.hasAnyErrors()}">
                <ul>
                    <li th:each="err: ${#fields.allErrors()}" th:text="${err}"></li>
                </ul>
            </div>

            <input type="submit" value="Submit" class="btn btn-primary"/>
        </form>
    </div>
    <div class="my-3 py-3">

        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
            <h2>Available Parts</h2>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Inventory</th>
                <th>Action</th>
            </tr>
            </thead>
            <form>
                <tr th:each="tempPart : ${availparts}">
                    <td th:text="${tempPart.name}">1</td>
                    <td th:text="${tempPart.price}">1</td>
                    <td th:text="${tempPart.inv}">1</td>
                    <td><a th:href="@{/associatepart(partID=${tempPart.id})}"
                           class="btn btn-primary btn-sm mb-3">Add</a>
                    </td>
                </tr>
            </form>
        </table>
    </div>
    <div class="my-3 py-3">
        <table class="table table-bordered table-striped">
            <h2>Associated Parts</h2>
            <thead class="thead-dark">
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Inventory</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tempPart : ${assparts}">
                <td th:text="${tempPart.name}">1</td>
                <td th:text="${tempPart.price}">1</td>
                <td th:text="${tempPart.inv}">1</td>
                <td><a th:href="@{/removepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Remove</a>
                </td>
            </tr>
            </tbody>

        </table>
    </div>
</main>
</body>
</html>
